name: Validation
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - name: Splendor card audit and independent rules comparison
        run: |
          npm run audit:splendor
          npm run verify:splendor
      - name: New game source audits and independent rules comparisons
        run: |
          for game in seven-wonders-duel carcassonne cascadia patchwork kingdomino; do
            for script in "scripts/audit-$game.mjs" "scripts/audit-$game-catalog.mjs" "scripts/verify-$game.mjs"; do
              if [ -f "$script" ]; then node "$script"; fi
            done
          done
      - name: Benchmark baseline vs guided search on the same runner
        run: npm run benchmark:search
      - name: Verify conditional MCTS reuse metrics
        run: npm run benchmark:reuse
      - name: Compare 10,000 complete games with independent rules oracle
        run: npm run verify:gameplay
      - name: Compare 2,000 Pentago games with an independent rules engine
        run: npm run verify:pentago
      - name: Smoke-test Pentago AI versus a baseline
        run: npm run benchmark:pentago -- --games=3 --playouts=6 --opponent=random
      - name: Smoke-test reproducible MCTS tournament
        run: npm run benchmark:ai -- --games=3 --playouts=8 --players=3
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Browser interaction smoke test
        run: |
          npm run stage:preview
          npm run package:game -- splendor preview/standalone-splendor
          for game in seven-wonders-duel carcassonne cascadia patchwork kingdomino; do
            if [ -f "$game/index.html" ]; then
              npm run package:game -- "$game" "preview/standalone-$game"
            fi
          done
          python3 -m http.server 8080 --directory preview --bind 127.0.0.1 >/tmp/tabletop-server.log 2>&1 &
          sleep 1
          node scripts/browser-smoke.mjs
          node scripts/browser-pentago.mjs
          node scripts/browser-sessions.mjs
          node scripts/browser-splendor.mjs
          failed=0
          for game in seven-wonders-duel carcassonne cascadia patchwork kingdomino; do
            if [ -f "scripts/browser-$game.mjs" ]; then
              STANDALONE_URL="http://127.0.0.1:8080/standalone-$game/" node "scripts/browser-$game.mjs" || failed=1
            fi
          done
          exit "$failed"
      - name: Save Splendor browser review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: splendor-browser-review
          path: /tmp/splendor-*.png
          if-no-files-found: ignore
      - name: Save new game browser review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-game-browser-review
          path: |
            /tmp/seven-wonders-duel-*.png
            /tmp/carcassonne-*.png
            /tmp/cascadia-*.png
            /tmp/patchwork-*.png
            /tmp/kingdomino-*.png
          if-no-files-found: ignore
