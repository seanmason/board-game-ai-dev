name: Validation
on:
  push:
    branches-ignore:
      - benchmarks/ai-comparison-2026-10-18
      - benchmarks/wingspan-overnight-2026-10-18
      - benchmarks/wingspan-neural-2026-10-19
      - benchmarks/wingspan-selfplay-2026-10-19
      - benchmarks/wingspan-data-efficiency-2026-10-19
      - benchmarks/wingspan-refit-2026-10-19
  pull_request:
  workflow_call:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - name: Check maintained documentation links and game entry points
        run: npm run check:docs
      - name: Splendor card audit and independent rules comparison
        run: |
          npm run audit:splendor
          npm run verify:splendor
      - name: New game source audits and independent rules comparisons
        run: |
          for game in seven-wonders-duel carcassonne cascadia patchwork kingdomino ticket-to-ride love-letter jaipur sushi-go lost-cities hive; do
            for script in "scripts/audit-$game.mjs" "scripts/audit-$game-catalog.mjs" "scripts/verify-$game.mjs"; do
              if [ -f "$script" ]; then node "$script"; fi
            done
          done
      - name: Full Wingspan turn and card-conservation scenarios
        run: WINGSPAN_GAMES=20 npm run verify:wingspan
      - name: Benchmark baseline vs guided search on the same runner
        run: npm run benchmark:search
      - name: Verify conditional MCTS reuse metrics
        run: npm run benchmark:reuse
      - name: Compare 10,000 complete games with independent rules oracle
        run: npm run verify:gameplay
      - name: Compare 2,000 Pentago games with an independent rules engine
        run: npm run verify:pentago
      - name: Compare Boop with an independent rules engine
        run: npm run verify:boop
      - name: Smoke-test Boop search
        run: npm run benchmark:boop -- --games=2 --ms=5 --opponent=random
      - name: Smoke-test Pentago AI versus a baseline
        run: npm run benchmark:pentago -- --games=3 --playouts=6 --opponent=random
      - name: Smoke-test reproducible MCTS tournament
        run: npm run benchmark:ai -- --games=3 --playouts=8 --players=3
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Browser interaction smoke test
        run: |
          npm run stage:preview
          npm run package:game -- splendor preview/standalone-splendor
          for game in seven-wonders-duel carcassonne cascadia patchwork kingdomino ticket-to-ride love-letter jaipur sushi-go lost-cities hive; do
            if [ -f "$game/index.html" ]; then
              npm run package:game -- "$game" "preview/standalone-$game"
            fi
          done
          python3 -m http.server 8080 --directory preview --bind 127.0.0.1 >/tmp/tabletop-server.log 2>&1 &
          sleep 1
          failed=0
          for script in smoke pentago wingspan sessions boop splendor dashboard; do
            node "scripts/browser-$script.mjs" || failed=1
          done
          for game in seven-wonders-duel carcassonne cascadia patchwork kingdomino ticket-to-ride love-letter jaipur sushi-go lost-cities hive; do
            if [ -f "scripts/browser-$game.mjs" ]; then
              STANDALONE_URL="http://127.0.0.1:8080/standalone-$game/" node "scripts/browser-$game.mjs" || failed=1
            fi
          done
          exit "$failed"
      - name: Upload Boop browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boop-browser-evidence
          path: test-artifacts/boop-*
          if-no-files-found: ignore
      - name: Save Wingspan desktop and touch review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wingspan-browser-review
          path: test-artifacts/wingspan-*.png
          if-no-files-found: ignore
      - name: Save Splendor browser review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: splendor-browser-review
          path: /tmp/splendor-*.png
          if-no-files-found: ignore
      - name: Save new game browser review images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: five-game-browser-review
          path: |
            /tmp/seven-wonders-duel-*.png
            /tmp/carcassonne-*.png
            /tmp/cascadia-*.png
            /tmp/patchwork-*.png
            /tmp/kingdomino-*.png
          if-no-files-found: ignore
      - name: Save six-game expansion browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expansion-browser-review
          path: |
            test-artifacts/ticket-to-ride-*.png
            test-artifacts/love-letter-*.png
            test-artifacts/jaipur-*.png
            test-artifacts/sushi-go-*.png
            test-artifacts/lost-cities-*.png
            test-artifacts/hive-*.png
            test-artifacts/benchmark-dashboard-*.png
          if-no-files-found: ignore
