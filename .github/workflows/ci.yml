name: Validation
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
      - name: Full Wingspan turn and card-conservation scenarios
        run: WINGSPAN_GAMES=20 npm run verify:wingspan
      - name: Benchmark baseline vs guided search on the same runner
        run: npm run benchmark:search
      - name: Verify conditional MCTS reuse metrics
        run: npm run benchmark:reuse
      - name: Compare 10,000 complete games with independent rules oracle
        run: npm run verify:gameplay
      - name: Compare 2,000 Pentago games with an independent rules engine
        run: npm run verify:pentago
      - name: Smoke-test Pentago AI versus a baseline
        run: npm run benchmark:pentago -- --games=3 --playouts=6 --opponent=random
      - name: Smoke-test reproducible MCTS tournament
        run: npm run benchmark:ai -- --games=3 --playouts=8 --players=3
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
      - name: Browser interaction smoke test
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/tabletop-server.log 2>&1 &
          sleep 1
          node scripts/browser-smoke.mjs
          node scripts/browser-pentago.mjs
          node scripts/browser-wingspan.mjs
