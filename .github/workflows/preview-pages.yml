name: Preview on GitHub Pages

# Development-only preview; this publishes publicly without touching the
# finished-game release repository.
on:
  push:
    branches:
      - main
      - feat/wingspan-base-game
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-pages-preview
  cancel-in-progress: false

jobs:
  validation:
    name: Full validation
    uses: ./.github/workflows/ci.yml

  build:
    name: Package validated browser preview
    needs: validation
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact development revision
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Stage only the public-facing website
        run: npm run stage:preview
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload preview
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./preview

  deploy:
    name: Publish preview
    runs-on: ubuntu-latest
    needs: build
    # The default github-pages environment was automatically restricted to
    # main; a separate environment permits the explicitly allowlisted preview
    # branch to deploy without merging unfinished implementation into main.
    environment:
      name: development-preview
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
